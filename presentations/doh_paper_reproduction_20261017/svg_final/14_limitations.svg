<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Aptos, Arial">
  <rect id="background" data-pptx-role="background" width="1280" height="720" fill="#F7F9FC"/><rect id="ledger-rule" data-pptx-role="decoration" x="64" y="42" width="6" height="630" fill="#0E7490"/>
  <g id="heading" data-pptx-bounds="100 48 1080 108"><text x="100" y="72" font-family="Consolas" font-size="16" fill="#0E7490" letter-spacing="2">13 · LIMITATIONS</text><text x="100" y="132" font-family="Aptos Display" font-size="30" font-weight="bold" fill="#14324B">What the current evidence does—and does not—establish</text></g>
  <g id="limitation-grid" data-pptx-bounds="100 184 1080 402">
    <rect x="100" y="184" width="520" height="186" rx="10" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
    <text x="132" y="226" font-size="18" font-weight="bold" fill="#D97706">01 · SAMPLE CAP</text><text x="132" y="268" font-size="22" font-weight="bold" fill="#14324B">25 flows per capture</text><text x="132" y="304" font-size="18" fill="#172033">Controls runtime; does not prove convergence.</text><text x="132" y="338" font-size="16" fill="#5B6875">Next: larger caps + repeated seeds.</text>
    <rect x="660" y="184" width="520" height="186" rx="10" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
    <text x="692" y="226" font-size="18" font-weight="bold" fill="#D97706">02 · CLASS AVAILABILITY</text><text x="692" y="268" font-size="22" font-weight="bold" fill="#14324B">Benign DoH stops at 325 flows</text><text x="692" y="304" font-size="18" fill="#172033">Requested quotas cannot all be filled.</text><text x="692" y="338" font-size="16" fill="#5B6875">Next: report confidence intervals.</text>
    <rect x="100" y="400" width="520" height="186" rx="10" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
    <text x="132" y="442" font-size="18" font-weight="bold" fill="#D97706">03 · DOMAIN SCOPE</text><text x="132" y="484" font-size="22" font-weight="bold" fill="#14324B">One benchmark environment</text><text x="132" y="520" font-size="18" fill="#172033">Unknown transfer to new resolvers and tools.</text><text x="132" y="554" font-size="16" fill="#5B6875">Next: cross-dataset external validation.</text>
    <rect x="660" y="400" width="520" height="186" rx="10" fill="#FFFFFF" stroke="#C9D3DC" stroke-width="2"/>
    <text x="692" y="442" font-size="18" font-weight="bold" fill="#D97706">04 · OPERATING POINT</text><text x="692" y="484" font-size="22" font-weight="bold" fill="#14324B">Best window chosen post sweep</text><text x="692" y="520" font-size="18" fill="#172033">Window selection needs nested validation.</text><text x="692" y="554" font-size="16" fill="#5B6875">Next: locked holdout and calibration.</text>
  </g>
  <g id="takeaway" data-pptx-bounds="100 608 1080 36"><text x="100" y="634" font-size="22" font-weight="bold" fill="#172033">Claim only the bounded comparison the experiment supports.</text></g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="100 662 1080 28"><text x="100" y="682" font-size="14" fill="#5B6875">Interpretation constrained by experiment manifest and provenance taxonomy</text><text x="1180" y="682" text-anchor="end" font-family="Consolas" font-size="14" fill="#5B6875">14</text></g>
</svg>
